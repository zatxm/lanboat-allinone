name: TUN platform tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tun:
    name: TUN ${{ matrix.goos == 'darwin' && 'macOS' || matrix.goos }}/${{ matrix.goarch }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, goos: linux, goarch: amd64}
          - {runner: ubuntu-24.04-arm, goos: linux, goarch: arm64}
          - {runner: windows-2025, goos: windows, goarch: amd64}
          - {runner: windows-11-arm, goos: windows, goarch: arm64}
          - {runner: macos-15-intel, goos: darwin, goarch: amd64}
          - {runner: macos-26, goos: darwin, goarch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Compile tests
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p .cache/tun-platform
          go test -c -o .cache/tun-platform/native.test${{ runner.os == 'Windows' && '.exe' || '' }} ./native
      - name: Obtain verified Windows driver for testing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DRIVER_ARCH: ${{ matrix.goarch }}
        run: |
          $path = '.cache/tun-platform/wintun.zip'
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile $path
          $expected = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Wintun archive checksum mismatch' }
          Expand-Archive $path .cache/tun-platform/driver
          Copy-Item ".cache/tun-platform/driver/wintun/bin/$env:DRIVER_ARCH/wintun.dll" .cache/tun-platform/wintun.dll
      - name: Windows device, DNS and WFP tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tracing = $false
          if (Get-Command pktmon.exe -ErrorAction SilentlyContinue) {
            pktmon filter remove
            $filtersOK = $LASTEXITCODE -eq 0
            pktmon filter add LanboatIPv4 -i 203.0.113.21
            $filtersOK = $filtersOK -and ($LASTEXITCODE -eq 0)
            pktmon filter add LanboatIPv6 -i 2001:db8::21
            $filtersOK = $filtersOK -and ($LASTEXITCODE -eq 0)
            if ($filtersOK) {
              pktmon start --capture --comp nics --pkt-size 0 --file-name .cache/tun-platform/packets.etl
              $tracing = $LASTEXITCODE -eq 0
            }
          }
          try {
            $testArgs = @('-test.run=^(TestTUN|TestUTUN)', '-test.v', '-test.timeout=5m')
            & .cache/tun-platform/native.test.exe @testArgs 2>&1 | Tee-Object .cache/tun-platform/tests.log
            $code = $LASTEXITCODE
          } finally {
            if ($tracing) {
              pktmon stop
              pktmon etl2txt .cache/tun-platform/packets.etl --out .cache/tun-platform/packets.txt
            }
          }
          exit $code
      - name: Unix device tests in disposable runner
        if: runner.os != 'Windows'
        shell: bash
        run: sudo .cache/tun-platform/native.test '-test.run=^(TestNativeTUNNamespace|TestTUN|TestUTUN)' -test.v -test.timeout=5m
      - name: Repeat macOS TUN startup and cleanup
        if: runner.os == 'macOS'
        shell: bash
        run: sudo .cache/tun-platform/native.test '-test.run=^TestTUNSystemDevice$' -test.count=20 -test.v -test.timeout=3m
      - name: macOS DNS startup race regression
        if: runner.os == 'macOS'
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          go test -c -race -o .cache/tun-platform/native-race.test ./native
          sudo .cache/tun-platform/native-race.test '-test.run=^TestTUNDarwinDNSStartup$' -test.count=3 -test.v -test.timeout=90s
      - name: Preserve Windows TUN diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: tun-diagnostics-${{ matrix.goarch }}
          path: |
            .cache/tun-platform/tests.log
            .cache/tun-platform/packets.txt
            .cache/tun-platform/packets.etl
          if-no-files-found: warn
